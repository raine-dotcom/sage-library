name: Library Pipeline Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/spaces-library-source]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genre classification tests
        run: node --test tests/genres.test.mjs
      - name: Validate processing and importer syntax
        run: |
          node --check scripts/process-books.mjs
          node --check scripts/sync-spaces.mjs
      - name: Validate existing catalog and export private digest manifest
        run: |
          node scripts/sync-spaces.mjs --dry-run --manifest-report="$RUNNER_TEMP/expected-manifests.json"
          node -e 'const r=require(process.env.RUNNER_TEMP+"/expected-manifests.json");if(r.books.length<1||r.books.some(b=>!b.digest))process.exit(1)'
