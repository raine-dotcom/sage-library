name: Library Pipeline Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/spaces-library-source]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genre and manifest tests
        run: node --test tests/genres.test.mjs tests/spaces-manifest.test.mjs
      - name: Validate processing and importer syntax
        run: |
          node --check scripts/process-books.mjs
          node --check scripts/sync-spaces.mjs
          node --check scripts/build-spaces-manifest.mjs
      - name: Build the published snapshot manifest and verify it matches importer digests
        run: |
          node scripts/build-spaces-manifest.mjs --write
          node -e 'const m=require("./data/spaces-manifest.json");if(m.source!=="raine-dotcom/sage-library"||m.books.length<1||m.books.some(b=>!b.digest||!b.pageDigest))process.exit(1)'
      - name: Validate existing catalog and export private digest manifest
        run: |
          node scripts/sync-spaces.mjs --dry-run --manifest-report="$RUNNER_TEMP/expected-manifests.json"
          node -e 'const r=require(process.env.RUNNER_TEMP+"/expected-manifests.json");if(r.books.length<1||r.books.some(b=>!b.digest))process.exit(1)'
      - name: Compare generated manifests to Sage HTTP importer algorithm
        run: |
          node -e 'const a=require("./data/spaces-manifest.json").books,b=require(process.env.RUNNER_TEMP+"/expected-manifests.json").books;if(JSON.stringify(a)!==JSON.stringify(b))process.exit(1)'
