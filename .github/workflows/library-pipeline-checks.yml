name: Library Pipeline Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/spaces-library-source]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genre classification tests
        run: node --test tests/genres.test.mjs
      - name: Validate processing and importer syntax
        run: |
          node --check scripts/process-books.mjs
          node --check scripts/sync-spaces.mjs
      - name: Validate complete existing catalog without publishing
        run: node scripts/sync-spaces.mjs --dry-run
